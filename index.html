<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#eff5f9">
  <title>영포티 피하기 | 민수와의 대화</title>
  <meta name="description" content="보드게임 동호회 지인 민수와의 대화. 답장으로 상대의 혼자만의 호감도를 낮추는 한국어 선택형 게임.">
  <meta name="robots" content="noindex, follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="영포티 피하기">
  <meta property="og:description" content="민수에게 뭐라고 답할까요? 최대 여덟 번의 답장으로 대화의 흐름이 달라집니다.">
  <meta property="og:url" content="https://emfls.github.io/youngforty-escape-preview/">
  <meta property="og:image" content="https://emfls.github.io/youngforty-escape-preview/images/cafe-open.jpg">
  <meta property="og:image:alt" content="영포티 피하기의 가상 카페 장면">
  <link rel="canonical" href="https://emfls.github.io/youngforty-escape-preview/">
  <link rel="icon" href="./mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./chat.css">
  <script type="module" src="./messenger.mjs"></script>
</head>
<body>
  <main class="phone" aria-label="영포티 피하기">
    <header class="room-bar">
      <a class="icon-button" id="back" href="./episodes.html" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
      </a>
      <div class="profile">
        <img class="avatar" src="./minsu.svg" width="42" height="42" alt="">
        <div><h1>민수 😎</h1><p>보드게임 동호회 · 개인 대화</p></div>
      </div>
      <details class="room-options" id="room-options">
        <summary class="icon-button" aria-label="더보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </summary>
        <div class="menu-panel">
          <p>대화 설정</p>
          <label><input type="checkbox" id="fast"> 빠르게 진행</label>
          <label><input type="checkbox" id="sound"> 알림 소리</label>
          <a href="./episodes.html">사진 이야기 목록</a>
          <button id="block" type="button">민수 차단하고 대화 끝내기</button>
        </div>
      </details>
    </header>

    <div class="interest">
      <div class="interest-label"><label for="score">상대의 혼자만의 호감도</label><strong id="score-value">60 / 100</strong></div>
      <meter id="score" min="0" max="100" value="60"></meter>
      <span id="turn-count">0 / 8턴</span>
    </div>

    <section class="conversation" id="conversation" tabindex="0" aria-label="대화 기록">
      <div class="welcome" id="welcome">
        <p class="caption">영포티 피하기</p>
        <h2 id="welcome-title" tabindex="-1">민수에게 톡이 왔어요</h2>
        <p>답장을 골라 민수의 혼자만의 호감도를 낮추세요. 0점이면 탈출, 100점이면 혼자 썸 타는 엔딩이에요.</p>
        <button class="yellow" type="button" id="start">대화 시작 <span aria-hidden="true">→</span></button>
        <p class="fiction">등장인물은 모두 가상의 성인입니다.</p>
        <noscript><p>게임을 시작하려면 자바스크립트를 켜 주세요.</p></noscript>
      </div>
      <div id="thread" hidden>
        <p class="day" id="day"></p>
        <ol id="chat-log" class="chat-log" role="log" aria-label="민수와 주고받은 메시지"></ol>
        <div class="typing" id="typing" hidden>
          <img src="./minsu.svg" width="30" height="30" alt="">
          <span class="typing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="sr-only">민수가 입력 중입니다.</span>
        </div>
        <section class="result" id="result" hidden aria-labelledby="ending-title">
          <p class="caption" id="result-status"></p>
          <h2 id="ending-title" tabindex="-1"></h2>
          <p id="ending-copy"></p>
          <dl><div><dt>진행 턴</dt><dd id="result-turns"></dd></div><div><dt>호감도</dt><dd id="result-score"></dd></div></dl>
          <h3 id="highlights-title">이 대화에 남은 답장</h3>
          <ul id="highlights"></ul>
          <label id="copy-fallback" hidden>결과 문구<textarea id="share-text" readonly rows="3"></textarea></label>
          <p id="copy-status" class="copy-status" role="status"></p>
        </section>
      </div>
    </section>

    <footer class="composer" id="composer" hidden>
      <p id="feedback" class="feedback" role="status" hidden></p>
      <p id="reply-title" class="composer-title" tabindex="-1">답장 고르기</p>
      <div id="replies" class="replies"></div>
      <button type="button" id="skip" class="skip" hidden>바로 읽기 <span aria-hidden="true">⏩</span></button>
      <div class="end-actions" id="end-actions" hidden>
        <button type="button" id="view-result" class="yellow">결과 보기</button>
        <button type="button" id="restart">다시 하기</button>
        <button type="button" id="share">결과 복사</button>
      </div>
    </footer>
  </main>
</body>
</html>
